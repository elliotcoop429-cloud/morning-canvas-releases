<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'">
  <title>Morning Canvas Loading</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f2f5f8; }
    canvas { display: block; width: 100%; height: 100%; }
    #fallback { position: absolute; top: 32%; left: 50%; transform: translate(-50%, -50%); font: 64px system-ui; color: #167ee5; }
    @media(prefers-color-scheme: dark) { html, body { background: #20262b; } }
  </style>
</head>
<body>
  <div id="fallback" aria-hidden="true">&#128218;</div>
  <script src="scene.js"></script>
</body>
</html>
